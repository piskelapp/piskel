name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to run on (leave empty for both)'
        required: false
        type: choice
        options:
          - all
          - ubuntu-26.04
          - macos-latest
        default: 'all'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A new push to a PR cancels the run still going on its previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx biome ci src/ tests/unit-tests/
      - run: npx tsc --noEmit
      - run: node scripts/check-forbidden-patterns.js
      - run: npm run spec-check

  e2e:
    # Keep the check name independent of the pinned runner version: the master
    # ruleset requires "e2e (ubuntu-latest)" and "e2e (macos-latest)".
    name: e2e (${{ startsWith(matrix.os, 'ubuntu') && 'ubuntu-latest' || 'macos-latest' }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event.inputs.os == 'all' && fromJson('["ubuntu-26.04","macos-latest"]') || github.event.inputs.os && fromJson(format('["{0}"]', github.event.inputs.os)) || fromJson('["ubuntu-26.04","macos-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Start memory sampler
        run: |
          (while true; do
            if [ "$RUNNER_OS" = macOS ]; then
              echo "$(date +%T) $(memory_pressure -Q | tail -1) | swap: $(sysctl -n vm.swapusage)"
            else
              echo "$(date +%T) $(free -m | awk '/Mem:/{printf "used=%sMB avail=%sMB ", $3, $7} /Swap:/{printf "swap=%sMB", $3}')"
            fi
            sleep 5
          done) > mem.log 2>&1 &
      - run: npm run test-ci
      - name: Memory summary
        if: always()
        run: |
          head -3 mem.log
          echo ...
          tail -3 mem.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem-${{ matrix.os }}
          path: mem.log

  visual:
    needs: lint
    runs-on: ubuntu-26.04
    # Keep this tag equal to the @playwright/test version: baselines are only
    # comparable when generated by the same image.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: tests/e2e/playwright/tmp
      - run: npm run visual:storyboard
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-storyboard
          path: tests/e2e/playwright/tmp-visual-storyboard